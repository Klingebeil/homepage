<meta property="og:title" content="{{ page.title }}"/>
<meta property="og:image" content="https://{{ site.url }}/img/{{ page.teaser-img }}"/>
<meta property="og:url" content="https://{{ site.url }}{{ page.url }}"/>
<meta property="og:image:width" content="500" />
<meta property="og:image:height" content="500" />
<meta property="og:type" content="article" />
{% if page.subtitle %}
<meta property="og:description" content="{{ page.subtitle }}" />
{% else %}
<meta property="og:description" content="{{ page.content | truncatewords:50 | strip_html }}" />
{% endif %}
<style>a {text-decoration-color: #FD675E !important;}</style>
<link rel="canonical" href="johannesklingebiel.de{{page.url}}">
<script language="JavaScript" type="text/javascript" src="/jquery-v3.7.1.min.js"></script>
