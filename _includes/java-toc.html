<div id="toc-wrapper">
  <div class="seg-line"></div>
  <details>
    <summary class="uppercase mono">Table of Contents</summary>
    <p id="toc" role="navigation"></p>
  </details>
  <div class="seg-line resp-no-display"></div>
</div>

<script type="text/javascript">
  $(document).ready(function() {
    var toc = $("#toc");
    toc.append("<ul></ul>");
  
    $("h1, h2, h3, h4, h5, h6, hr").each(function(index) {
      var heading = $(this);

      //console.log("---> element: " + this.tagName)
      var headingText = heading.text();
      var headingId = headingText.replace(/\s+/g, '-').toLowerCase();
      heading.attr('id', headingId);
      var level = parseInt(this.tagName.charAt(1));
      //console.log("---> level: " + level);
  
      // Adjust indentation based on the heading level
      var indentation = level - 1;
      if (this.tagName == "HR") {
        var listItem ="<li class='toc-break'></li>"
      } else {
        var listItem = "<li style='padding-left: " + (indentation * 20) + "px;' class='toc" + level + "'><a href='#" + headingId + "'>" + headingText + "</a></li>";
      }
        
      $("#toc ul").append(listItem);
    });

    // Add class to the corresponding heading in the TOC when in viewport
    $(window).on('scroll', function() {
      var scrollPos = $(window).scrollTop();
      var windowHeight = $(window).height();

      console.log(scrollPos);

      // Remove 'active' class from all toc items
      $("#toc li").removeClass('active');
      
      var activeTocItem = null;
      $("h1, h2, h3, h4, h5, h6").each(function() {
        var header = $(this);
        var headerId = header.attr('id');
        var headerPosition = header.position().top;
        var tocItem = $("#toc a[href='#" + headerId + "']").parent();
        
        if (headerPosition <= scrollPos + (windowHeight * 0.8)) {
          if (activeTocItem != null) {
            activeTocItem.removeClass('active');
          }
          activeTocItem = tocItem;
          activeTocItem.addClass('active');
          console.log("activeTocItem: " + activeTocItem.text());
        }
      });
    });

  });
  </script>
